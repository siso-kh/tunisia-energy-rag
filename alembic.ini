# Alembic configuration for the Tunisia Energy RAG database.
#
# The database URL is NOT set here: alembic/env.py resolves it the same way
# the app does (explicit --url / DATABASE_URL env var / local Postgres
# default), so migrations and the app always agree on the target database.
[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is resolved in env.py — do not set it here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
