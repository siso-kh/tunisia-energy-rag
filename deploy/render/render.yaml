# Render Blueprint for the minimised deployment.
#
# Deploy with:  Render Dashboard -> New -> Blueprint -> pick this repo
# (Render reads render.yaml from the repo root, so either move/copy this file
#  there, or create the service manually with the settings below.)
#
# Every value marked `sync: false` is a secret you fill in the dashboard —
# none of them are committed here.

services:
  - type: web
    name: tunisia-energy-rag
    runtime: docker

    # dockerfilePath is relative to the REPO ROOT, and the build context must
    # be the repo root (the image needs frontend/, src/, alembic/, data/).
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .

    region: frankfurt          # closest to Tunisia (eu-central-1)
    branch: main

    # ------------------------------------------------------------------
    # PLAN: "free" and "starter" are BOTH 512 MB RAM and WILL NOT RUN.
    #
    # Measured resident memory of this app (see README §Memory):
    #   ~135 MB  Python + FastAPI + chromadb + openai
    #   ~250 MB  tokenizer (XLM-R vocabulary, unavoidable)
    #   ~280 MB  ONNX embedder (model_O4)
    #   ~195 MB  Chroma corpus held for BM25 fusion
    #   ~160 MB  BM25 index
    #   ------
    #   ~940 MB  peak, with torch entirely off the query path
    #
    # So "standard" (2 GB) is the smallest plan that fits, with room for the
    # ingestion path. On 512 MB the container was OOM-killed at boot while
    # loading the embedding model, and every request answered 502.
    # ------------------------------------------------------------------
    plan: standard

    healthCheckPath: /health

    # Runs once per deploy, before traffic shifts. The entrypoint also runs
    # migrations as a fallback, so this is belt-and-braces (and idempotent).
    preDeployCommand: alembic upgrade head

    envVars:
      # --- Required ---------------------------------------------------
      - key: DATABASE_URL        # postgresql://...?sslmode=require (sync format for ensure_schema)
        sync: false
      - key: CUSTOM_API_KEY      # Mistral / OpenAI-compatible key
        sync: false
      - key: JWT_SECRET          # without it, auth endpoints return 503
        generateValue: true
      - key: ADMIN_API_KEY       # protects /api/admin/*
        generateValue: true

      # --- ChromaDB index ---------------------------------------------
      # Only needed if the image is built from git (no data/chroma_db in the
      # context). See README.md §3.
      - key: CHROMA_URL
        sync: false

      # --- Recommended / optional -------------------------------------
      # Provider endpoint. Must match the provider that serves the models in
      # LLM_MODELS below (router.bynara.id serves combo/freemodels).
      - key: OPENAI_BASE_URL
        value: https://router.bynara.id/v1
      - key: RERANK_ENABLED
        # Must be set explicitly. The image deliberately omits the ~470 MB
        # cross-encoder, and hybrid.py defaults this to "true" when unset, so a
        # missing value makes the app try to download it inside live requests.
        value: "false"
      - key: CORS_ORIGINS
        sync: false              # https://<your-service>.onrender.com
      # Only models verified against this provider. Each entry that 404s is
      # disabled automatically at runtime, but starting from a clean list keeps
      # failover fast. deepseek-v4-flash / qwen3.8-27b / stepfun-3.7-flash
      # returned 429 (per-model quota) and glm-5.3-flash-free / nemotron-3-ultra
      # returned 404, so they are deliberately excluded.
      - key: LLM_MODELS
        value: "agnes-2.5-flash,laguna-s-2.1,combo/freemodels"
      - key: LLM_MODEL
        value: "combo/freemodels"
        sync: false
      # Latency tuning. REWRITE_ENABLED=false skips the extra pre-generation
      # round-trip entirely; see retrieve.py for the full list.
      - key: REWRITE_ENABLED
        value: "true"
      - key: LLM_SAME_MODEL_RETRIES
        value: "1"
      - key: LLM_QUOTA_TTL
        value: "900"
      # Keep-alive comment interval on /api/chat/stream. Retrieval runs in a
      # threadpool and can block for tens of seconds; without bytes on the wire
      # during that gap the edge drops the response and the client just spins.
      - key: SSE_HEARTBEAT_SECONDS
        value: "10"
      # Where the image bakes the ONNX query embedder. Point it somewhere
      # else to use a different build, or leave unset to fall back to the
      # in-process sentence-transformer (which needs ~830 MB).
      - key: ONNX_EMBEDDER_DIR
        value: "/opt/models/onnx"
      - key: OUTAGE_TTL_HOURS
        value: "5"
      - key: RATE_LIMIT_STORAGE_URI
        value: memory://

      # Do NOT set TRUST_PROXY_HEADERS=true: nginx already forwards the real
      # client IP and spoofing protection should stay on.
