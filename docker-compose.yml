services:
  # ===================== PostgreSQL (async SQLAlchemy layer) =====================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: energie_tunisie
    # Host port 5433 to avoid clashing with a locally installed Postgres on 5432.
    # The app itself always connects internally via the service name "postgres".
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energie_tunisie"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ===================== One-shot database seeder =====================
  # Applies the Alembic schema migrations (seed() -> ensure_schema) then
  # populates demo data once Postgres is healthy, and exits. Reseed anytime
  # with:
  #   docker compose run --rm db-seed python -m src.database.seed --reset
  db-seed:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python -m src.database.seed
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/energie_tunisie
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ===================== FastAPI backend =====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/energie_tunisie
      # Security: Disable proxy header trust to prevent XFF spoofing (L14 fix)
      TRUST_PROXY_HEADERS: "false"
      # Frontend is served same-origin through nginx, but allow cross-origin
      # access for the ngrok tunnel / direct backend calls.
      CORS_ORIGINS: "*"
      RATE_LIMIT_STORAGE_URI: "memory://"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      # Schema migrations + seed run before the backend accepts traffic, so
      # the app never starts against a missing/empty schema.
      db-seed:
        condition: service_completed_successfully
    # Wide start_period: importing the API loads the sentence-transformers
    # embedding model, which can take 30-60s+ on a cold first start.
    # Readiness (/ready) also verifies Postgres + ChromaDB are reachable, so
    # the backend only turns healthy once its dependencies respond.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ===================== React frontend (Vite build -> Nginx) =====================
  # Nginx serves the static build and reverse-proxies /api to the backend
  # (same-origin, no CORS).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    # Proxied through Nginx -> backend /ready (verifies the full chain incl. deps)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  # ===================== Nightly Postgres backups =====================
  # Runs pg_dump on an interval (default 24h) into ./backups, keeping the
  # last BACKUP_RETENTION_DAYS days (default 7). Restore drill:
  #   docker compose exec -T postgres pg_restore -U postgres -d energie_tunisie \
  #     --clean --if-exists < backups/energie_tunisie_<timestamp>.dump
  pg-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[pg-backup] waiting for postgres to accept connections..."
        until pg_isready -h postgres -U postgres -d energie_tunisie >/dev/null 2>&1; do sleep 5; done
        echo "[pg-backup] connected. Backup loop: every $${BACKUP_INTERVAL_HOURS}h, keeping $${BACKUP_RETENTION_DAYS}d."
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          PGPASSWORD=postgres pg_dump -h postgres -U postgres -d energie_tunisie -F c -f /backups/energie_tunisie_$${ts}.dump
          echo "[pg-backup] wrote /backups/energie_tunisie_$${ts}.dump"
          find /backups -name 'energie_tunisie_*.dump' -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep $${BACKUP_INTERVAL_HOURS}h
        done
    depends_on:
      postgres:
        condition: service_healthy

  # ===================== Prometheus metrics =====================
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      backend:
        condition: service_healthy

  # ===================== Grafana dashboards =====================
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started

  # ===================== Ngrok public tunnel =====================
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "frontend:80"
    ports:
      - "4040:4040"
    # Token read from the project .env file (gitignored). Copy .env.example to .env first.
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env (see .env.example)}"
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: