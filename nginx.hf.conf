# nginx main config for the single-container Hugging Face Space.
#
# It replaces /etc/nginx/nginx.conf (the Debian default), because HF runs the
# container as UID 1000: the stock config writes its pid/logs under root-owned
# /var paths. Everything writable here lives under /tmp, and we listen on the
# Space port 7860 (which does not require root, unlike port 80).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths for an unprivileged worker.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    # Admin PDF uploads are capped at 50 MB in the backend (MAX_UPLOAD_BYTES).
    client_max_body_size 60m;

    upstream api_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 7860 default_server;
        server_name _;

        root /home/user/app/frontend/dist;
        index index.html;

        # Hashed static assets -> cache aggressively.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API -> FastAPI (same origin, so the SPA's relative /api paths work).
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE: do not buffer the chat stream.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            add_header X-Accel-Buffering no;
        }

        location = /health {
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
        }

        # Readiness probe (also checks Postgres + ChromaDB behind the scenes).
        location = /ready {
            proxy_pass http://api_backend/ready;
            proxy_set_header Host $host;
        }

        # SPA fallback: client-side routing (/, /map, /calculator, /admin).
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
